<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header class="wb-header">
      <a class="wb-home" href="../">← Workbench</a>
      <h1>JSON</h1>
      <button type="button" class="wb-theme-toggle" id="theme-toggle"></button>
    </header>
    <main class="wb-main json-main">
      <div class="wb-row toolbar">
        <button
          type="button"
          class="wb-btn wb-btn--primary"
          id="format"
          title="Format (Ctrl+Enter)"
        >
          Format
        </button>
        <button type="button" class="wb-btn" id="minify">Minify</button>
        <label class="wb-label option">
          <input type="checkbox" id="sort-keys" />
          Sort keys
        </label>
        <label class="wb-label option">
          Indent
          <select class="wb-select" id="indent">
            <option value="2">2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="tab">Tab</option>
          </select>
        </label>
        <span class="toolbar-gap"></span>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="open"
          title="Open a file"
          aria-label="Open a file"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
        </button>
        <button type="button" class="wb-btn icon-btn" id="copy" title="Copy" aria-label="Copy">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
          </svg>
        </button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="download"
          title="Download"
          aria-label="Download"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
          </svg>
        </button>
        <button type="button" class="wb-btn icon-btn" id="clear" title="Clear" aria-label="Clear">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
        </button>
      </div>

      <textarea
        class="wb-code editor"
        id="editor"
        aria-label="JSON"
        placeholder="Paste JSON here, or drop a .json file"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
      ></textarea>

      <div class="statusbar">
        <p class="wb-status" id="status" role="status"></p>
        <span class="wb-label wb-mono" id="cursor"></span>
      </div>
      <p class="wb-status warning hidden" id="warning"></p>
      <div class="problem hidden" id="problem">
        <pre class="excerpt" id="excerpt"></pre>
        <button type="button" class="wb-btn" id="goto">Go to error</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <!-- One row, grouped by what the controls act on: the view, the layout, finding, the file.
         Controls that cannot apply are disabled, never hidden, so nothing moves. -->
    <header class="wb-header json-header">
      <a class="wb-home" href="../" title="All tools">Workbench</a>
      <h1>JSON</h1>

      <div class="group" role="group" aria-label="View">
        <div class="seg" role="group" aria-label="Show as">
          <button type="button" class="wb-btn" data-view="text" aria-pressed="true">Text</button>
          <button type="button" class="wb-btn" data-view="tree" aria-pressed="false">Tree</button>
          <button type="button" class="wb-btn" data-view="yaml" aria-pressed="false">YAML</button>
          <button type="button" class="wb-btn" data-view="csv" aria-pressed="false">CSV</button>
          <button
            type="button"
            class="wb-btn"
            data-view="ts"
            aria-pressed="false"
            title="TypeScript types"
          >
            Types
          </button>
          <button type="button" class="wb-btn" data-view="schema" aria-pressed="false">
            Schema
          </button>
        </div>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="expand-all"
          title="Expand all"
          aria-label="Expand all"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 16l-5 5-5-5M7 8l5-5 5 5" /></svg>
        </button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="collapse-all"
          title="Collapse all"
          aria-label="Collapse all"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20l5-5 5 5M17 4l-5 5-5-5" /></svg>
        </button>
      </div>

      <div class="group" role="group" aria-label="Layout">
        <button
          type="button"
          class="wb-btn wb-btn--primary"
          id="format"
          title="Format (Ctrl+Enter)"
        >
          Format
        </button>
        <button type="button" class="wb-btn" id="minify">Minify</button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="options-btn"
          popovertarget="options"
          aria-haspopup="true"
          title="Options"
          aria-label="Options"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4" />
          </svg>
        </button>
        <div class="menu options" id="options" popover aria-label="Options">
          <div class="menu-label first">Format with</div>
          <div class="menu-row">
            <span>Indent</span>
            <div class="seg small" role="group" aria-label="Indent">
              <button type="button" class="wb-btn" data-indent="2" aria-pressed="true">2</button>
              <button type="button" class="wb-btn" data-indent="4" aria-pressed="false">4</button>
              <button type="button" class="wb-btn" data-indent="tab" aria-pressed="false">
                Tab
              </button>
            </div>
          </div>
          <div class="menu-row">
            <span>Sort keys</span>
            <button
              type="button"
              class="wb-btn toggle small"
              id="sort-keys"
              aria-pressed="false"
              aria-label="Sort keys"
            >
              Off
            </button>
          </div>
          <div class="menu-label">Paths</div>
          <div class="menu-row">
            <span>Style</span>
            <div class="seg small" role="group" aria-label="Path style">
              <button type="button" class="wb-btn" data-path-style="js" aria-pressed="true">
                a.b[0]
              </button>
              <button type="button" class="wb-btn" data-path-style="pointer" aria-pressed="false">
                /a/b/0
              </button>
            </div>
          </div>
          <div class="menu-label">Nested JSON</div>
          <button type="button" class="menu-item" data-action="unwrap">Unwrap JSON string</button>
          <button type="button" class="menu-item" data-action="wrap">Wrap value in a string</button>
        </div>
      </div>

      <div class="end">
        <div class="group">
          <button
            type="button"
            class="wb-btn icon-btn"
            id="find-open"
            title="Find (Ctrl+F)"
            aria-label="Find (Ctrl+F)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM15.5 15.5 20 20" />
            </svg>
          </button>
        </div>

        <div class="group" role="group" aria-label="File">
          <button
            type="button"
            class="wb-btn icon-btn"
            id="open"
            title="Open a file"
            aria-label="Open a file"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
          </button>
          <button type="button" class="wb-btn icon-btn" id="copy" title="Copy" aria-label="Copy">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" />
              <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
            </svg>
          </button>
          <button
            type="button"
            class="wb-btn icon-btn"
            id="download"
            title="Download"
            aria-label="Download"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12M7 10l5 5 5-5M5 21h14" />
            </svg>
          </button>
          <button type="button" class="wb-btn icon-btn" id="clear" title="Clear" aria-label="Clear">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
            </svg>
          </button>
        </div>

        <button type="button" class="wb-theme-toggle" id="theme-toggle"></button>
      </div>
    </header>

    <main class="json-main">
      <div class="bar findbar hidden" id="findbar" role="search">
        <input
          class="wb-input find-input"
          id="find-input"
          type="search"
          placeholder="Find"
          aria-label="Find"
          spellcheck="false"
        />
        <span class="wb-label find-count" id="find-count" aria-live="polite"></span>
        <button
          type="button"
          class="wb-btn toggle case-toggle"
          id="find-case"
          aria-pressed="false"
          title="Match case"
          aria-label="Match case"
        >
          Aa
        </button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="find-prev"
          title="Previous match (Shift+Enter)"
          aria-label="Previous match (Shift+Enter)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" /></svg>
        </button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="find-next"
          title="Next match (Enter)"
          aria-label="Next match (Enter)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="find-close"
          title="Close (Esc)"
          aria-label="Close (Esc)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </div>

      <div class="code" id="code">
        <div class="gutter" aria-hidden="true"><div class="gutter-lines" id="gutter"></div></div>
        <div class="code-body">
          <pre class="highlight" aria-hidden="true"><code id="highlight"></code></pre>
          <textarea
            class="wb-code editor"
            id="editor"
            aria-label="JSON"
            placeholder="Paste JSON here, or drop a .json file"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
          ></textarea>
        </div>
      </div>
      <div class="tree hidden" id="tree" role="tree" aria-label="JSON tree"></div>
      <pre class="export hidden" id="export" tabindex="0"></pre>

      <div class="bar pager hidden" id="pager">
        <button
          type="button"
          class="wb-btn icon-btn"
          id="page-prev"
          title="Previous page"
          aria-label="Previous page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <label class="wb-label">
          Page
          <input
            class="wb-input page-input"
            id="page-input"
            type="number"
            min="1"
            inputmode="numeric"
          />
          of <span id="page-count"></span>
        </label>
        <button
          type="button"
          class="wb-btn icon-btn"
          id="page-next"
          title="Next page"
          aria-label="Next page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <span class="wb-label" id="page-lines"></span>
      </div>

      <div class="bar problem hidden" id="problem">
        <pre class="excerpt" id="excerpt"></pre>
        <button type="button" class="wb-btn" id="goto">Go to error</button>
        <span class="wb-label hidden" id="fix-note"></span>
        <button type="button" class="wb-btn wb-btn--primary hidden" id="fix">Fix</button>
      </div>
      <p class="bar wb-status warning hidden" id="warning"></p>

      <div class="bar statusbar">
        <p class="wb-status" id="status" role="status"></p>
        <span class="where">
          <button type="button" class="path wb-mono hidden" id="path" title="Copy path"></button>
          <span class="wb-label wb-mono" id="cursor"></span>
        </span>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
